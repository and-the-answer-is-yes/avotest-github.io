
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok OAuth Redirect Catcher</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --border: #e2e5e9;
    --accent: #0f62fe;
    --mono-bg: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c;
      --card: #202226;
      --text: #edeef0;
      --muted: #9aa0a6;
      --border: #33363a;
      --accent: #6ea8fe;
      --mono-bg: #2a2d31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .card {
    max-width: 640px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
  .empty { color: var(--muted); font-size: 0.95rem; }
  .field {
    margin-bottom: 14px;
    padding: 12px;
    background: var(--mono-bg);
    border-radius: 8px;
  }
  .field .name {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field .value {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9rem;
    word-break: break-all;
  }
  .likely {
    border: 2px solid var(--accent);
  }
  button {
    font: inherit;
    font-size: 0.85rem;
    padding: 6px 12px;
    margin-top: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.copied { border-color: var(--accent); color: var(--accent); }
  .raw {
    margin-top: 20px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .raw code {
    display: block;
    margin-top: 6px;
    word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>OAuth redirect catcher</h1>
    <p class="sub">Static page, no backend, nothing sent anywhere &mdash; it only reads the URL your browser landed on.</p>
    <div id="fields"></div>
    <div class="raw" id="raw" hidden>
      Full query string:
      <code id="rawValue"></code>
    </div>
  </div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var fieldsEl = document.getElementById('fields');

  // Common names TikTok / other providers use for the authorization code.
  var codeKeys = ['auth_code', 'code', 'authCode', 'authorization_code'];

  if ([...params.keys()].length === 0) {
    var empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = 'No parameters in the URL yet — this page is waiting for TikTok to redirect here after you approve access.';
    fieldsEl.appendChild(empty);
    return;
  }

  params.forEach(function (value, key) {
    var isLikelyCode = codeKeys.indexOf(key) !== -1;

    var field = document.createElement('div');
    field.className = 'field' + (isLikelyCode ? ' likely' : '');

    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = key + (isLikelyCode ? '  ← likely the auth code' : '');

    var val = document.createElement('div');
    val.className = 'value';
    val.textContent = value;

    var copyBtn = document.createElement('button');
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', function () {
      navigator.clipboard.writeText(value).then(function () {
        copyBtn.textContent = 'Copied';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1500);
      });
    });

    field.appendChild(name);
    field.appendChild(val);
    field.appendChild(copyBtn);
    fieldsEl.appendChild(field);
  });

  var rawEl = document.getElementById('raw');
  var rawValueEl = document.getElementById('rawValue');
  rawValueEl.textContent = window.location.href;
  rawEl.hidden = false;
})();
</script>
</body>
</html>
